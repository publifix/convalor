<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Convalor — Próximamente</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="El nuevo sitio de Convalor está en construcción. Vuelve pronto.">
<meta name="theme-color" content="#050807">
<link rel="icon" href="assets/logo-blanco-aqua.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050807;
    --bg-2: #0b1211;
    --aqua: #00c7b8;
    --aqua-bright: #2be3d3;
    --ink: #f4faf9;
    --ink-dim: rgba(244, 250, 249, 0.62);
    --ink-faint: rgba(244, 250, 249, 0.34);
    --border: rgba(244, 250, 249, 0.12);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }

  .glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(46rem 30rem at 50% -8%, rgba(0, 199, 184, 0.24), transparent 60%),
      radial-gradient(38rem 26rem at 88% 108%, rgba(0, 199, 184, 0.12), transparent 65%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  }

  .grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image:
      linear-gradient(rgba(244, 250, 249, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(244, 250, 249, 0.05) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(60rem 40rem at 50% 20%, black, transparent 75%);
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .logo {
    width: min(320px, 78vw);
    height: auto;
    filter: drop-shadow(0 0 28px rgba(0, 199, 184, 0.28));
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: rgba(244, 250, 249, 0.03);
  }

  .tag .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--aqua-bright);
    box-shadow: 0 0 10px 2px rgba(43, 227, 211, 0.65);
    animation: pulse 2.2s ease-in-out infinite;
    flex: none;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.6rem, 9vw, 4.5rem);
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  h1 span {
    background: linear-gradient(100deg, var(--aqua-bright) 0%, var(--aqua) 55%, #17e0cf 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.lede {
    margin: 0;
    max-width: 46ch;
    font-size: clamp(1rem, 2.4vw, 1.15rem);
    line-height: 1.6;
    color: var(--ink-dim);
  }

  .divider {
    width: 100%;
    max-width: 220px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border) 50%, transparent);
    margin: 4px 0;
  }

  footer {
    font-size: 0.82rem;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
  }

  @media (prefers-reduced-motion: reduce) {
    .tag .dot { animation: none; }
  }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>

  <main>
    <img class="logo" src="assets/logo-blanco-aqua.png" alt="Convalor">

    <span class="tag"><span class="dot"></span>En construcción</span>

    <h1>Estamos preparando algo<br><span>impecable</span>.</h1>

    <p class="lede">El nuevo sitio de Convalor está en camino. Muy pronto encontrarás aquí todo lo que estamos construyendo.</p>

    <div class="divider" aria-hidden="true"></div>

    <footer>&copy; <span id="year"></span> Convalor. Todos los derechos reservados.</footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
